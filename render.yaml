services:
  # 1. Fullstack Web Service (React Frontend + Express API)
  - type: web
    name: civicresolve-web
    env: node
    plan: free
    buildCommand: "cd frontend && bun install && bun run build && cd ../backend && bun install"
    startCommand: "cd backend && bun server.js"
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5001
      - key: NODE_ENV
        value: production
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: civicresolve-ai
          property: host

  # 2. Python AI Microservice (FastAPI NLP Classifier)
  - type: web
    name: civicresolve-ai
    env: python
    plan: free
    buildCommand: "cd ai-service && pip install -r requirements.txt"
    startCommand: "cd ai-service && python -m uvicorn main:app --host 0.0.0.0 --port 8000"
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
