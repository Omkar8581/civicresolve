services:
  # 1. Full-Stack Web Service (React Frontend + Express API)
  - type: web
    name: civicresolve-web
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: civicresolve-ai
          property: host

  # 2. Python AI Microservice (FastAPI NLP Classifier)
  - type: web
    name: civicresolve-ai
    runtime: python
    plan: free
    buildCommand: cd ai-service && pip install -r requirements.txt
    startCommand: cd ai-service && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
